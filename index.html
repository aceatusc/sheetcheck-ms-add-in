<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pista</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="styles/theme.css" />
    <link rel="stylesheet" href="styles/chat.css" />
    <link rel="stylesheet" href="styles/execution.css" />
    <link rel="stylesheet" href="styles/stepNavigator.css" />
    <link rel="stylesheet" href="styles/aspect.css" />
</head>
<body>

<!-- Chat Panel -->
<div id="chat-panel">
    <div id="chat-header">
        <div class="logo-dot"></div>
        <h1>Pista</h1>
        <span class="model-badge" hidden>AI</span>
        <button id="verify-btn" class="verify-header-btn" title="Open Verify panel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
            </svg>
            Specifications
        </button>
    </div>
    <div id="message-feed">
        <div class="message agent" id="welcome-message">
            <div class="message-bubble">
                👋 Hi! Describe a change you'd like to see in your worksheet.
            </div>
            <span class="message-meta">Assistant</span>
        </div>
        <div id="typing-indicator">
            <span id="typing-label"></span>
            <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
        </div>
    </div>
    <div id="input-bar">
        <div id="input-row">
            <textarea id="chat-input" rows="1" placeholder="Ask me to change your spreadsheet…"></textarea>
            <button id="send-button" disabled>
                <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>
</div>

<!-- Step Navigator -->
<div id="step-navigator">
    <button id="step-nav-close">✕</button>

    <!-- SF1.2: Dependency graph -->
    <div id="step-nav-graph"></div>

    <div id="step-nav-badge">Step 1 of 8</div>
    <div id="step-nav-ranges"></div>
    <div id="step-nav-description">Description</div>
    <div id="step-nav-explanation">Explanation</div>

    <!-- Navigation footer -->
    <div id="step-nav-footer">
        <button id="step-nav-edit" class="nav-action-btn">Edit</button>
        <button id="step-nav-ask"  class="nav-action-btn">Ask</button>
        <div id="step-nav-pagination">
            <button class="step-nav-arrow" id="step-nav-prev" disabled>&#8592;</button>
            <span id="step-nav-counter">1/8</span>
            <button class="step-nav-arrow" id="step-nav-next">&#8594;</button>
        </div>
    </div>

    <!-- SF1.3: Ask panel -->
    <div id="step-nav-ask-panel" style="display:none">
        <!-- SF1.3: Q&A pairs -->
        <div id="step-nav-qa-list"></div>
        <div id="step-nav-ask-thread"></div>
        <div id="step-nav-ask-chips"></div>
        <div id="step-nav-ask-input-row">
            <textarea id="step-nav-ask-input" rows="1" placeholder="Ask about this step…"></textarea>
            <button id="step-nav-ask-send">↑</button>
        </div>
    </div>

    <!-- SF2.1: Edit panel -->
    <div id="step-nav-edit-panel" style="display:none">
        <div id="step-nav-edit-params"></div>
        <div id="step-nav-edit-chips"></div>
        <textarea id="step-nav-edit-feedback" rows="2" placeholder="Describe your edit…"></textarea>
        <button id="step-nav-edit-send">Apply Edit</button>
    </div>

    <!-- SF1.4: Rubric panel — kept for StepNavigator internal use (edit/ask toggle) -->
    <div id="step-nav-rubric" style="display:none">
        <div class="rubric-section-label">Hard Requirements</div>
        <div id="rubric-hard-list"></div>
        <div class="rubric-section-label">Soft Requirements</div>
        <div id="rubric-soft-list"></div>
        <button id="rubric-add-btn" class="rubric-add">+ Add requirement</button>
        <div id="rubric-verify-results"></div>
    </div>
</div>

<!-- Aspect / Verify Panel -->
<div id="aspect-overlay">
    <button class="aspect-close" id="aspect-close-btn">✕</button>
    <div class="aspect-toolbar">
        <button class="aspect-btn aspect-btn--populate" id="aspect-populate-btn">
            <span class="aspect-btn-icon">⟳</span> Populate
        </button>
        <button class="aspect-btn aspect-btn--add" id="aspect-add-btn">+ Add</button>
    </div>
    <div id="aspect-list" class="aspect-list"></div>
    <button class="aspect-btn aspect-btn--verify" id="aspect-verify-btn">
            <span class="aspect-btn-icon">✓</span> Verify
    </button>
</div>
<div id="execution-panel">
    <div id="execution-header">
        <div id="execution-status-dot"></div>
        <span>Execution Log</span>
        <span id="execution-toggle-icon">▲</span>
    </div>
    <div id="execution-body">
        <div id="segment-progress">
            <div id="segment-bar-track"><div id="segment-bar-fill"></div></div>
            <span id="segment-label">0 / 0</span>
        </div>
        <div id="execution-log"></div>
    </div>
</div>

<script src="modules/officeInit.js"></script>
<script src="modules/worksheetContext.js"></script>
<script src="modules/llmClient.js"></script>
<script src="modules/dagStore.js"></script>
<script src="modules/worksheetSnapshot.js"></script>
<script src="modules/dagRunner.js"></script>
<script src="modules/rubricManager.js"></script>
<script src="modules/aspectManager.js"></script>
<script src="modules/stepNavigator.js"></script>
<script src="modules/executionEngine.js"></script>
<script src="modules/chatManager.js"></script>
<script src="modules/app.js"></script>
<script src="modules/chatHistory.js"></script>
</body>
</html>
